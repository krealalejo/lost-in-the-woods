pre-push:
  commands:
    block-main:
      run: |
        BRANCH=$(git branch --show-current)
        if [ "$BRANCH" = "main" ]; then
          echo "ERROR: Push directo a main no permitido. Usa un PR."
          exit 1
        fi
    test:
      run: pnpm test

post-checkout:
  commands:
    bump-version:
      run: |
        [ "{3}" != "1" ] && exit 0
        BRANCH=$(git branch --show-current)
        [ -z "$BRANCH" ] && exit 0
        case "$BRANCH" in release/*) ;; *) exit 0 ;; esac
        REFLOG_COUNT=$(git reflog show "$BRANCH" 2>/dev/null | wc -l | tr -d ' ')
        [ "$REFLOG_COUNT" -ne 1 ] && exit 0
        VERSION=$(date +%y.%m.%d)
        node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '$VERSION';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
        "
        echo "Version bumped to $VERSION in package.json"
